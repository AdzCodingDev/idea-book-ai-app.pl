<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Idea AI Book</title>
  <desc id="desc">Purple rounded-square logo with a light open book and a white AI label.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7242c8"/>
